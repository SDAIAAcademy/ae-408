[project]
name = "ae-408-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course AE-408 Multimodal and Speech Systems Engineering"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "pydantic>=2.12",
    "jiwer>=4.0",
    "openai>=2.0",
    "python-dotenv>=1.1",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "matplotlib>=3.9",
    "jupyterlab>=4.4",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
